name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # prisma.service.spec.ts instantiates a real PrismaClient, whose constructor
      # requires DATABASE_URL to be set. The tests never query it, so a dummy
      # postgres URL is enough and no live database is needed.
      - run: npm run test:cov
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/movie_forum_ci

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t movie-forum-api:ci ./backend

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # vite build only transpiles, so types are checked separately.
      - run: npm run typecheck
      - run: npm run build
